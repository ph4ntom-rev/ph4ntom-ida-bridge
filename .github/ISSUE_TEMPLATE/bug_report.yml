name: Bug report
description: Something doesn't work as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in as much detail as possible.

  - type: input
    id: ida-version
    attributes:
      label: IDA Pro version
      description: Help -> About program (including build number if possible)
      placeholder: "e.g. 9.1.250226"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      description: Python used by IDA (run `import sys; print(sys.version)` in the IDA Output window)
      placeholder: "e.g. 3.12.4"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
        - macOS
    validations:
      required: true

  - type: dropdown
    id: interface
    attributes:
      label: Which interface are you using?
      multiple: true
      options:
        - MCP
        - REST API
        - CLI
        - Agent
        - Installation / setup
    validations:
      required: true

  - type: input
    id: bridge-version
    attributes:
      label: Bridge version / commit
      placeholder: "e.g. v1.2.0 or commit hash"
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the problem.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open binary ...
        2. Run ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs / traceback
      description: Full error from the IDA Output window or bridge console. Will be formatted as code automatically.
      render: shell
    validations:
      required: false
